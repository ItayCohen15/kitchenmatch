<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ===== Viewport ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ===== iOS PWA ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Staffly" />
    <!-- iOS Safari does NOT render SVG apple-touch-icons — must reference a PNG -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- ===== Android / Chrome ===== -->
    <meta name="theme-color" content="#131626" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ===== General ===== -->
    <meta name="description" content="Staffly — חיבור מיידי בין מסעדות, ברים ובתי קפה לעובדי הסעדה למשמרת" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- PNG favicon fallback — some browsers/crawlers don't render SVG favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>Staffly</title>

    <!-- ===== Canonical + Social (Open Graph / Twitter) ===== -->
    <link rel="canonical" href="https://stafflyil.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Staffly" />
    <meta property="og:title" content="Staffly" />
    <meta property="og:description" content="Staffly — חיבור מיידי בין מסעדות, ברים ובתי קפה לעובדי הסעדה למשמרת" />
    <meta property="og:url" content="https://stafflyil.com" />
    <meta property="og:image" content="https://stafflyil.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Staffly" />
    <meta name="twitter:description" content="Staffly — חיבור מיידי בין מסעדות, ברים ובתי קפה לעובדי הסעדה למשמרת" />
    <meta name="twitter:image" content="https://stafflyil.com/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
